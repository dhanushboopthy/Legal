services:
  api:
    build: .
    # Shared with the worker below: one image, two commands.
    image: legal-filing-api
    # No published port: the browser reaches the api only through nginx
    # (web), which adds the security headers. For direct local access, map a
    # port in docker-compose.override.yml.
    env_file: .env
    environment:
      # Reads objects (draft validation) over the internal network; the
      # browser-facing S3_ENDPOINT_URL in .env is only for signing URLs.
      S3_INTERNAL_ENDPOINT_URL: http://storage:8333
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Housekeeping loop (python -m app.worker): today it deletes draft cases
  # nobody submitted within DRAFT_RETENTION_DAYS, along with their files. Same
  # image as the api; safe to run more than one.
  worker:
    build: .
    image: legal-filing-api
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      S3_INTERNAL_ENDPOINT_URL: http://storage:8333
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-legal_filing}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]

  # Self-hosted S3-compatible document store. The browser PUTs/GETs directly
  # against this via presigned URLs (the api only signs them), so only the S3
  # port is published — the master/filer ports it also opens are
  # unauthenticated admin interfaces and must stay on the internal network.
  storage:
    image: chrislusf/seaweedfs:4.47
    command:
      - server
      - -dir=/data
      # Default volume size is 30GB, which makes SeaweedFS refuse to allocate
      # any volume on a smaller disk ("no free volumes left").
      - -master.volumeSizeLimitMB=1024
      - -s3
      - -s3.allowedOrigins=${STORAGE_ALLOWED_ORIGINS:-http://localhost:3100}
      - -s3.encryptVolumeData
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
    volumes:
      - storagedata:/data
    ports:
      - "8333:8333"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://$$(hostname -i):9333/cluster/healthz && curl -s -o /dev/null http://127.0.0.1:8333/
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  storage-init:
    image: chrislusf/seaweedfs:4.47
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-legal-filing-documents}
    entrypoint:
      - sh
      - -c
      - echo "s3.bucket.create -name $$S3_BUCKET_NAME" | weed shell -master=storage:9333
    restart: "no"

  bff:
    build: ./frontend/bff
    environment:
      BACKEND_URL: http://api:8000
      PORT: "4000"
      NODE_ENV: production
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ./frontend/web
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    environment:
      # Allowed in the Content-Security-Policy so the browser may load and
      # upload documents there. Set CSP_S3_ORIGIN when S3_ENDPOINT_URL is
      # empty (real AWS), e.g. https://<bucket>.s3.ap-south-1.amazonaws.com
      CSP_S3_ORIGIN: ${CSP_S3_ORIGIN:-${S3_ENDPOINT_URL:-http://localhost:8333}}
      # Who may set the visitor's address (CF-Connecting-IP). Off locally;
      # docker-compose.prod.yml sets the compose network's range.
      REAL_IP_FROM: ${REAL_IP_FROM:-127.0.0.1/32}
    ports:
      - "3000:80"
    depends_on:
      - bff
      - api
    restart: unless-stopped

volumes:
  pgdata:
  storagedata:
